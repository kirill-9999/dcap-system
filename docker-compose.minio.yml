# docker-compose.minio.yml
# MinIO — S3-совместимое хранилище для аудит-логов (Блок 6.3, фикс BUG-120).
#
# Запуск:
#   docker compose -f docker-compose.minio.yml up -d
#   Start-Sleep 15; curl.exe -s -o NUL -w "HTTP %{http_code}`n" http://localhost:9000/minio/health/live
#
# Консоль: http://localhost:9001 (minioadmin / minioadmin)
#
# ⚠️ Учётные данные minioadmin/minioadmin — только для dev-стенда.
#    Для production задайте MINIO_ROOT_USER/MINIO_ROOT_PASSWORD в .env.
#
# Адрес MinIO для агента зависит от способа запуска:
#   • MinIO в Docker (этот файл)  → http://minio:9000            (сеть dcap-network)
#   • MinIO нативно на хосте      → http://host.docker.internal:9000
# В текущем окружении образы minio/* не проходят pull, поэтому используется
# нативный E:\Dev\MinIO\bin\minio.exe и S3_ENDPOINT=host.docker.internal:9000.

services:
  minio:
    image: minio/minio:latest
    container_name: dcap-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dcap-minio-data:/data
    networks:
      - dcap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  dcap-minio-data:
    name: dcap-minio-data

networks:
  dcap-network:
    external: true
