syntax = "proto3";

package dcap;

service Manager {
    // Scanner методы
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
    
    // Resource методы
    rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse);
    rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
    rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
    rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);
    
    // Schedule методы
    rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
    rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
    rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
    
    // Report методы
    rpc ReportBatch(stream ReportChunk) returns (ReportResponse);
    rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
    
    // HealthCheck
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ========== Scanner сообщения ==========
message RegisterRequest {
    string scanner_name = 1;
    string endpoint = 2;
}

message RegisterResponse {
    string scanner_id = 1;
    bool success = 2;
    string message = 3;
}

message HeartbeatRequest {
    string scanner_id = 1;
}

message HeartbeatResponse {
    bool success = 1;
    string message = 2;
}

message GetTaskRequest {
    string scanner_id = 1;
}

message GetTaskResponse {
    bool has_task = 1;
    string task_id = 2;
    string resource_id = 3;
    string resource_path = 4;
    string resource_type = 5;
    int32 batch_size = 6;
}

// ========== Resource сообщения ==========
message CreateResourceRequest {
    string resource_type = 1;
    string path = 2;
    map<string, string> config = 3;
}

message CreateResourceResponse {
    bool success = 1;
    string resource_id = 2;
    string message = 3;
}

message ListResourcesRequest {
    bool include_disabled = 1;
}

message ListResourcesResponse {
    repeated ResourceInfo resources = 1;
}

message ResourceInfo {
    string id = 1;
    string type = 2;
    string path = 3;
    bool enabled = 4;
    string last_scan_start = 5;
    string last_scan_end = 6;
    string created_at = 7;
}

message GetResourceRequest {
    string resource_id = 1;
}

message GetResourceResponse {
    ResourceInfo resource = 1;
}

message DeleteResourceRequest {
    string resource_id = 1;
}

message DeleteResourceResponse {
    bool success = 1;
    string message = 2;
}

// ========== Schedule сообщения ==========
message CreateScheduleRequest {
    string resource_id = 1;
    string cron_expression = 2;
    int32 priority = 3;
    int32 max_files_per_batch = 4;
}

message CreateScheduleResponse {
    bool success = 1;
    string schedule_id = 2;
    string message = 3;
}

message ListSchedulesRequest {
    string resource_id = 1;
}

message ListSchedulesResponse {
    repeated ScheduleInfo schedules = 1;
}

message ScheduleInfo {
    string id = 1;
    string resource_id = 2;
    string cron_expression = 3;
    int32 priority = 4;
    int32 max_files_per_batch = 5;
    bool enabled = 6;
    string last_run = 7;
    string next_run = 8;
    string created_at = 9;
}

message DeleteScheduleRequest {
    string schedule_id = 1;
}

message DeleteScheduleResponse {
    bool success = 1;
    string message = 2;
}

// ========== ReportBatch сообщения ==========
message ReportChunk {
    string scanner_id = 1;
    string task_id = 2;
    repeated Finding findings = 3;
    repeated CatalogEntry catalog = 4;
    repeated FailedFile failed = 5;
}

message Finding {
    string file_path = 1;
    string file_hash = 2;
    int64 file_size = 3;
    string file_modified = 4;
    string classifier_name = 5;
    string category = 6;
    string subcategory = 7;
    string value = 8;
    double confidence = 9;
    string detection_method = 10;
    string context = 11;
}

message CatalogEntry {
    string folder_path = 1;
    string source_type = 2;
    repeated string classifiers = 3;
    repeated string subcategories = 4;
    int32 findings_count = 5;
}

message FailedFile {
    string path = 1;
    string error = 2;
    string error_type = 3;
}

message ReportResponse {
    bool success = 1;
    string message = 2;
    int32 findings_received = 3;
    int32 catalog_entries_received = 4;
}

// ========== CompleteTask сообщения ==========
message CompleteTaskRequest {
    string scanner_id = 1;
    string task_id = 2;
    int32 files_scanned = 3;
    int32 findings_count = 4;
    bool success = 5;
    string error_message = 6;
}

message CompleteTaskResponse {
    bool success = 1;
    string message = 2;
}

// ========== HealthCheck сообщения ==========
message HealthCheckRequest {
    string service = 1;
}

message HealthCheckResponse {
    bool healthy = 1;
    string status = 2;
    string message = 3;
    int64 timestamp = 4;
    Metrics metrics = 5;
}

message Metrics {
    int32 active_scanners = 1;
    int32 pending_tasks = 2;
    int32 running_tasks = 3;
    int32 completed_tasks = 4;
    int32 failed_tasks = 5;
    int64 total_findings = 6;
}