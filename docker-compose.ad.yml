# docker-compose.ad.yml
# Samba AD DC для тестирования AD-интеграции DCAP (День 33).
#
# Запуск:
#   docker-compose -f docker-compose.ad.yml up -d
#   python scripts/init_ad_test_data.py

version: '3.8'

services:
  samba-ad-dc:
    image: diegogslomp/samba-ad-dc
    container_name: dcap-ad-dc
    privileged: true
    restart: unless-stopped
    environment:
      REALM: 'SAMDOM.EXAMPLE.COM'
      DOMAIN: 'SAMDOM'
      ADMIN_PASS: 'Passw0rd'
      DNS_FORWARDER: '8.8.8.8'
    hostname: DC1
    # После провижининга samba-domain-provision записывает имя интерфейса
    # из `ip a` в docker-нотации с суффиксом @ifN (например eth0@if7) в smb.conf,
    # из-за чего samba слушает только loopback (внешний LDAP отваливается).
    # Обёртка нормализует строку interfaces перед стартом samba.
    command: ["/bin/bash", "-c", "samba-domain-provision && sed -i 's/eth0@if[0-9]*/eth0/' /usr/local/samba/etc/smb.conf 2>/dev/null || true && samba -F"]
    ports:
      # host-порты 53/135/139/445 на Windows-хосте заняты системными службами
      # (DNS/SMB), поэтому они перевешены на свободные host-порты.
      - "1353:53"
      - "1353:53/udp"
      - "88:88"
      - "464:464"
      - "1135:135"
      - "1139:139"
      - "389:389"
      - "1445:445"
      - "636:636"
      - "3268:3268"
      - "3269:3269"
    volumes:
      - samba_data:/var/lib/samba
      - samba_logs:/var/log/samba

  redis:
    image: redis:7-alpine
    container_name: dcap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  samba_data:
  samba_logs:
  redis_data: