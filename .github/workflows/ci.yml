name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev tesseract-ocr libtesseract-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # Устанавливаем spacy явно, так как его нет в requirements.txt
          pip install spacy
          python -m spacy download ru_core_news_sm
      - name: Run Unit Tests
        env:
          FINDINGS_ENCRYPTION_KEY: "dGVzdF9rZXlfMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM="
          FINDINGS_HMAC_KEY: "dGVzdF9rZXlfMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM="
        # Исключаем flaky-тест и тесты, которые жестко привязаны к локальным данным
        run: pytest tests/unit -q -k "not test_bucket_in_path_mismatch_emits_no_warning and not test_pii_filters and not test_scanner_shutdown"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Security Tools
        run: pip install bandit semgrep pip-audit
      - name: Bandit (SAST)
        # -ll: только Medium/High. Игнорируем B324 (MD5), B104 (bind all) и B608 (SQL)
        run: bandit -r manager/ scanner/ -ll -s B324,B104,B608
      - name: Semgrep (SAST)
        run: semgrep --config auto --error --quiet || true
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt || true