name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev tesseract-ocr libtesseract-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install spacy boto3 presidio-analyzer presidio-anonymizer
          python -m spacy download ru_core_news_sm
      - name: Run Unit Tests
        # Генерируем фиктивные ключи прямо в CI (безопасно, без хардкода в файле)
        run: |
          export FINDINGS_ENCRYPTION_KEY=$(python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())")
          export FINDINGS_HMAC_KEY=$(python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())")
          
          pytest tests/unit -q \
            --ignore=tests/unit/test_catalog_entries_s3_v31330.py \
            --ignore=tests/unit/test_dedup_v31410.py \
            --ignore=tests/unit/test_encryption.py \
            --ignore=tests/unit/test_factory_v31330.py \
            --ignore=tests/unit/test_multiprocessing_v31411.py \
            --ignore=tests/unit/test_pii_filters_v31315.py \
            --ignore=tests/unit/test_pii_filters_v31316.py \
            --ignore=tests/unit/test_scanner_findings.py \
            --ignore=tests/unit/test_scanner_shutdown.py \
            --ignore=tests/unit/test_s3_line_connector_v31331.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Security Tools
        run: pip install bandit semgrep pip-audit
      - name: Bandit (SAST)
        run: bandit -r manager/ scanner/ -ll -s B324,B104,B608
      - name: Semgrep (SAST)
        run: semgrep --config auto --error --quiet || true
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt || true