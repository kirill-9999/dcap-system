# DCAP System — Alertmanager (День 39)
route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://manager:8000/api/alerts/webhook'  # опционально
        send_resolved: true
