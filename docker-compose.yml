# DCAP System — основной docker-compose (production)
# NOTE: используется только для deployment-сценариев. Локальный запуск —
# через run_all.py / run_manager.py / run_webui.py (см. AGENTS.md).
#
# Стек (День 36-37): PostgreSQL 16 + Redis 7 + Manager + WebUI +
# Celery worker / beat / flower (:5555).

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  db_password:
    file: ./secrets/db_password.txt
  ad_service_password:
    file: ./secrets/ad_service_password.txt

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcap-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dcap}
      - POSTGRES_USER=${POSTGRES_USER:-dcap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dcap123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcap} -d ${POSTGRES_DB:-dcap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dcap-redis
    command: ["redis-server", "--requirepass", "$${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    container_name: dcap-manager
    ports:
      - "8000:8000"
    volumes:
      - ./certs/manager:/app/certs/manager:ro
      - ./certs/ca:/app/certs/ca:ro
      - ./certs/crl:/app/certs/crl:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - MTLS_ENABLED=true
      - CERT_PATH=/app/certs/manager/manager.crt
      - KEY_PATH=/app/certs/manager/manager.key
      - CA_PATH=/app/certs/ca/ca.crt
      - JWT_SECRET_KEY_FILE=/run/secrets/jwt_secret_key
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - AD_SERVICE_PASSWORD_FILE=/run/secrets/ad_service_password
    secrets:
      - jwt_secret_key
      - db_password
      - ad_service_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: dcap-webui
    ports:
      - "8001:8001"
    volumes:
      - ./certs/webui:/app/certs/webui:ro
      - ./certs/ca:/app/certs/ca:ro
    environment:
      - MANAGER_URL=${MANAGER_URL:-http://manager:8000}
      - MTLS_ENABLED=true
      - CERT_PATH=/app/certs/webui/webui.crt
      - KEY_PATH=/app/certs/webui/webui.key
      - CA_PATH=/app/certs/ca/ca.crt
    depends_on:
      - manager

  celery_worker:
    build:
      context: .
      dockerfile: manager/Dockerfile
    container_name: dcap-celery-worker
    command: celery -A manager.src.workers.celery_app:app worker --loglevel=INFO --queues=audit_events,scanner_tasks,retention,reports --concurrency=2
    volumes:
      - ./certs/ca:/app/certs/ca:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - JWT_SECRET_KEY_FILE=/run/secrets/jwt_secret_key
    secrets:
      - jwt_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: manager/Dockerfile
    container_name: dcap-celery-beat
    command: celery -A manager.src.workers.celery_app:app beat --loglevel=INFO
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    secrets:
      - jwt_secret_key
    depends_on:
      redis:
        condition: service_healthy

  celery_flower:
    build:
      context: .
      dockerfile: manager/Dockerfile
    container_name: dcap-celery-flower
    command: celery -A manager.src.workers.celery_app:app flower --port=5555 --loglevel=INFO
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  pg_data: