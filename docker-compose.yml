# DCAP System — полный стек (День 38)
# Деплой одной командой: docker compose up -d
# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Агенты (S3/MinIO) запускаются через profile: agents
#   docker compose --profile agents up -d
#
# Сканер НЕ в Docker (День 38.5+) — он запускается на хосте через run_scanner.py:
#   python run_scanner.py scanner/config/scanner_config.json
# Причина: задания приходят с путями хоста (E:\..., /mnt/...). Docker-контейнер
# может видеть только заранее смонтированные тома и не может сам примонтировать
# папку из задания. На хосте сканер видит любые пути напрямую.
#
# Build-контекст manager/worker/beat/s3 — КОРЕНЬ репо (пакет shared/ + root requirements.txt).

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ===== БАЗА ДАННЫХ =====
  postgres:
    image: postgres:16-alpine
    container_name: dcap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcap}
      POSTGRES_USER: ${POSTGRES_USER:-dcap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcap123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: dcap-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== MANAGER =====
  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    image: dcap/manager:${VERSION:-3.5.0}
    container_name: dcap-manager
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Fallback для dev (если secrets не заданы)
      FINDINGS_KEY_ID: ${FINDINGS_KEY_ID:-key-2026-09}
    secrets:
      - findings_encryption_key
      - findings_hmac_key
      - findings_key_id
    volumes:
      - ./manager/certs:/app/certs:ro
      - manager_data:/app/data
      - manager_logs:/app/logs
    ports:
      - "${MANAGER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== CELERY WORKER =====
  celery_worker:
    build:
      context: .
      dockerfile: manager/Dockerfile
    image: dcap/manager:${VERSION:-3.5.0}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: celery -A manager.src.workers.celery_app:app worker -Q audit_events,scanner_tasks,retention,reports -c 4 --loglevel=info
    healthcheck: # celery-worker: не HTTP-сервер, поэтому НЕ наследуем HEALTHCHECK manager/Dockerfile (curl :8000/api/health)
      test: ["CMD-SHELL", "celery -A manager.src.workers.celery_app:app inspect ping --timeout=10 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== CELERY BEAT =====
  celery_beat:
    build:
      context: .
      dockerfile: manager/Dockerfile
    image: dcap/manager:${VERSION:-3.5.0}
    container_name: dcap-celery-beat
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: celery -A manager.src.workers.celery_app:app beat --loglevel=info
    healthcheck:
      # celery beat — планировщик, а не HTTP-сервер: проверяем брокер через redis ping.
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis123} -h redis ping | findstr /r \"PONG\\|NOAUTH\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      - redis
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== FLOWER =====
  celery_flower:
    image: mher/flower:latest
    container_name: dcap-flower
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== WEBUI =====
  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    image: dcap/webui:${VERSION:-3.5.0}
    container_name: dcap-webui
    environment:
      MANAGER_URL: http://manager:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${WEBUI_PORT:-8001}:8001"
    depends_on:
      manager:
        condition: service_healthy
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== S3 AGENT (MinIO/S3) =====
  s3_agent:
    build:
      context: .
      dockerfile: audit-agent-s3/Dockerfile
    image: dcap/s3-agent:${VERSION:-3.5.0}
    container_name: dcap-s3-agent
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
      S3_BUCKET: ${S3_BUCKET:-dcap-logs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MANAGER_URL: http://manager:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - s3_agent_data:/app/audit-agent-s3/data
      - s3_agent_logs:/app/audit-agent-s3/logs
    depends_on:
      manager:
        condition: service_healthy
    profiles:
      - agents
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== LINUX AGENT (профиль agents) =====
  audit_agent_linux:
    build:
      context: .
      dockerfile: audit-agent-linux/Dockerfile
    image: dcap/linux-agent:${VERSION:-3.5.0}
    container_name: dcap-linux-agent
    environment:
      MANAGER_URL: http://manager:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - linux_agent_data:/app/audit-agent-linux/data
      - linux_agent_logs:/app/audit-agent-linux/logs
    depends_on:
      manager:
        condition: service_healthy
    profiles:
      - agents
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== MONITORING (День 39) =====
  prometheus:
    image: prom/prometheus:latest
    container_name: dcap-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - manager
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: dcap-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    container_name: dcap-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dcap-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}?sslmode=disable"
    ports:
      - "${PG_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A manager.src.workers.celery_app:app inspect ping --timeout=10 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    <<: *default-restart
    logging: *default-logging

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: dcap-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  celery_exporter:
    image: danihodovic/celery-exporter:latest
    container_name: dcap-celery-exporter
    environment:
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0"
    # образ danihodovic/celery-exporter принимает брокер ТОЛЬКО CLI-флагом --broker-url (env недостаточно)
    command:
      - celery-exporter
      - "--broker-url"
      - "redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0"
    ports:
      - "${CELERY_EXPORTER_PORT:-9808}:9808"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

networks:
  dcap-network:
    driver: bridge
    name: dcap-network

secrets:
  findings_encryption_key:
    file: ./secrets/findings_encryption_key
  findings_hmac_key:
    file: ./secrets/findings_hmac_key
  findings_key_id:
    file: ./secrets/findings_key_id

volumes:
  postgres_data:
    name: dcap-postgres-data
  redis_data:
    name: dcap-redis-data
  manager_data:
    name: dcap-manager-data
  manager_logs:
    name: dcap-manager-logs
  s3_agent_data:
    name: dcap-s3-agent-data
  s3_agent_logs:
    name: dcap-s3-agent-logs
  linux_agent_data:
    name: dcap-linux-agent-data
  linux_agent_logs:
    name: dcap-linux-agent-logs
  prometheus_data:
    name: dcap-prometheus-data
  grafana_data:
    name: dcap-grafana-data