# DCAP System вЂ” РїРѕР»РЅС‹Р№ СЃС‚РµРє (Р”РµРЅСЊ 38)
# Р”РµРїР»РѕР№ РѕРґРЅРѕР№ РєРѕРјР°РЅРґРѕР№: docker compose up -d
# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# РђРіРµРЅС‚С‹ (S3/MinIO) Р·Р°РїСѓСЃРєР°СЋС‚СЃСЏ С‡РµСЂРµР· profile: agents
#   docker compose --profile agents up -d
#
# РЎРєР°РЅРµСЂ РќР• РІ Docker (Р”РµРЅСЊ 38.5+) вЂ” РѕРЅ Р·Р°РїСѓСЃРєР°РµС‚СЃСЏ РЅР° С…РѕСЃС‚Рµ С‡РµСЂРµР· run_scanner.py:
#   python run_scanner.py scanner/config/scanner_config.json
# РџСЂРёС‡РёРЅР°: Р·Р°РґР°РЅРёСЏ РїСЂРёС…РѕРґСЏС‚ СЃ РїСѓС‚СЏРјРё С…РѕСЃС‚Р° (E:\..., /mnt/...). Docker-РєРѕРЅС‚РµР№РЅРµСЂ
# РјРѕР¶РµС‚ РІРёРґРµС‚СЊ С‚РѕР»СЊРєРѕ Р·Р°СЂР°РЅРµРµ СЃРјРѕРЅС‚РёСЂРѕРІР°РЅРЅС‹Рµ С‚РѕРјР° Рё РЅРµ РјРѕР¶РµС‚ СЃР°Рј РїСЂРёРјРѕРЅС‚РёСЂРѕРІР°С‚СЊ
# РїР°РїРєСѓ РёР· Р·Р°РґР°РЅРёСЏ. РќР° С…РѕСЃС‚Рµ СЃРєР°РЅРµСЂ РІРёРґРёС‚ Р»СЋР±С‹Рµ РїСѓС‚Рё РЅР°РїСЂСЏРјСѓСЋ.
#
# Build-РєРѕРЅС‚РµРєСЃС‚ manager/worker/beat/s3 вЂ” РљРћР Р•РќР¬ СЂРµРїРѕ (РїР°РєРµС‚ shared/ + root requirements.txt).

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ===== Р‘РђР—Рђ Р”РђРќРќР«РҐ =====
  postgres:
    image: postgres:16-alpine
    container_name: dcap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcap}
      POSTGRES_USER: ${POSTGRES_USER:-dcap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcap123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: dcap-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== MANAGER =====
  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    image: dcap/manager:${VERSION:-3.13.25}
    container_name: dcap-manager
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERSION: ${VERSION:-3.13.12}
      # Ключи Findings — только ENV (TASK-018; для dev fallback отключён)
      FINDINGS_ENCRYPTION_KEY: ${FINDINGS_ENCRYPTION_KEY}
      FINDINGS_HMAC_KEY: ${FINDINGS_HMAC_KEY}
      FINDINGS_KEY_ID: ${FINDINGS_KEY_ID:-key-2026-09}
      # BACKLOG-086 (TASK-046/050, v3.13.19): встраивание OCR-фрагментов
      MAX_FRAGMENT_EMBED_SIZE: ${MAX_FRAGMENT_EMBED_SIZE:-2097152}
      MAX_BATCH_SIZE_BYTES: ${MAX_BATCH_SIZE_BYTES:-20971520}
    volumes:
      - ./manager/config:/app/config:ro
      - ./manager/certs:/app/certs:ro
      - manager_data:/app/data
      - manager_logs:/app/logs
    ports:
      - "${MANAGER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== CELERY WORKER =====
  celery_worker:
    build:
      context: .
      dockerfile: manager/Dockerfile
    image: dcap/manager:${VERSION:-3.13.25}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERSION: ${VERSION:-3.13.12}
    command: celery -A manager.src.workers.celery_app:app worker -Q audit_events,scanner_tasks,retention,reports -c 4 --loglevel=info
    healthcheck: # celery-worker: РЅРµ HTTP-СЃРµСЂРІРµСЂ, РїРѕСЌС‚РѕРјСѓ РќР• РЅР°СЃР»РµРґСѓРµРј HEALTHCHECK manager/Dockerfile (curl :8000/api/health)
      test: ["CMD-SHELL", "celery -A manager.src.workers.celery_app:app inspect ping --timeout=10 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== CELERY BEAT =====
  celery_beat:
    build:
      context: .
      dockerfile: manager/Dockerfile
    image: dcap/manager:${VERSION:-3.13.25}
    container_name: dcap-celery-beat
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERSION: ${VERSION:-3.13.12}
    command: celery -A manager.src.workers.celery_app:app beat --loglevel=info
    healthcheck:
      # celery beat вЂ” РїР»Р°РЅРёСЂРѕРІС‰РёРє, Р° РЅРµ HTTP-СЃРµСЂРІРµСЂ: РїСЂРѕРІРµСЂСЏРµРј Р±СЂРѕРєРµСЂ (redis) С‡РµСЂРµР· python socket.
      test:
        - "CMD-SHELL"
        - python3 -c "import socket;s=socket.create_connection(('redis',6379),timeout=5);s.sendall(b'PING\r\n');print(s.recv(1024).decode());s.close()" | grep -qE "PONG|NOAUTH" || exit 1
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      - redis
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== FLOWER =====
  celery_flower:
    image: mher/flower:latest
    container_name: dcap-flower
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== WEBUI =====
  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    image: dcap/webui:${VERSION:-3.13.25}
    container_name: dcap-webui
    environment:
      MANAGER_URL: http://manager:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERSION: ${VERSION:-3.13.12}
    ports:
      - "${WEBUI_PORT:-8001}:8001"
    depends_on:
      manager:
        condition: service_healthy
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== S3 AGENT (MinIO/S3) =====
  s3_agent:
    build:
      context: .
      dockerfile: audit-agent-s3/Dockerfile
    image: dcap/s3-agent:${VERSION:-3.13.16}
    container_name: dcap-s3-agent
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
      S3_BUCKET: ${S3_BUCKET:-dcap-logs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MANAGER_URL: http://manager:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERSION: ${VERSION:-3.13.12}
    volumes:
      - s3_agent_data:/app/audit-agent-s3/data
      - s3_agent_logs:/app/audit-agent-s3/logs
    depends_on:
      manager:
        condition: service_healthy
    profiles:
      - agents
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== LINUX AGENT (РїСЂРѕС„РёР»СЊ agents) =====
  audit_agent_linux:
    build:
      context: audit-agent-linux
      dockerfile: Dockerfile
    image: dcap/linux-agent:${VERSION:-3.13.16}
    container_name: dcap-linux-agent
    environment:
      MANAGER_URL: http://manager:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERSION: ${VERSION:-3.13.12}
    volumes:
      - linux_agent_data:/app/audit-agent-linux/data
      - linux_agent_logs:/app/audit-agent-linux/logs
    depends_on:
      manager:
        condition: service_healthy
    profiles:
      - agents
    <<: *default-restart
    logging: *default-logging
    networks:
      - dcap-network

  # ===== SAMBA AD DC (профиль ad, День 33 + v3.13.8) =====
  # Включается ТОЛЬКО с профилем ad:
  #   docker compose --profile ad up -d
  # Без профиля основной стек не затронут (redis, manager, s3-агент остаются).
  samba-ad-dc:
    image: diegogslomp/samba-ad-dc
    container_name: dcap-ad-dc
    privileged: true
    profiles:
      - ad
    environment:
      REALM: 'SAMDOM.EXAMPLE.COM'
      DOMAIN: 'SAMDOM'
      ADMIN_PASS: 'Passw0rd'
      DNS_FORWARDER: '8.8.8.8'
    hostname: DC1
    # Проблема samba-domain-provision: контейнер стартует в docker-сети, и `ip a`
    # в докер-контейнере отдаёт @ifN (например eth0@if7) в smb.conf,
    # из-за чего samba стартует на loopback (недоступен LDAP снаружи).
    # Фикс: заменить interfaces на eth0 после provisioning.
    command: ["/bin/bash", "-c", "samba-domain-provision && sed -i 's/eth0@if[0-9]*/eth0/' /usr/local/samba/etc/smb.conf 2>/dev/null || true && samba -F"]
    ports:
      # host-часть 53/135/139/445 — из-за Windows-машины с занятыми этими портами
      # (DNS/SMB), поэтому используем альтернативные host-порты.
      - "1353:53"
      - "1353:53/udp"
      - "88:88"
      - "464:464"
      - "1135:135"
      - "1139:139"
      - "389:389"
      - "1445:445"
      - "636:636"
      - "3268:3268"
      - "3269:3269"
    volumes:
      - samba_data:/var/lib/samba
      - samba_logs:/var/log/samba
    networks:
      dcap-network:
        aliases:
          - dcap.local
          - dc1.dcap.local
    <<: *default-restart
    logging: *default-logging

  # ===== MONITORING (Р”РµРЅСЊ 39) =====
  prometheus:
    image: prom/prometheus:latest
    container_name: dcap-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - manager
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: dcap-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    container_name: dcap-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dcap-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-dcap}:${POSTGRES_PASSWORD:-dcap123}@postgres:5432/${POSTGRES_DB:-dcap}?sslmode=disable"
    ports:
      - "${PG_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dcap-network
    # BUG-017.1: healthcheck РЈР”РђР›РЃРќ вЂ” РѕР±СЂР°Р· prometheuscommunity/postgres-exporter
    # (distroless: РЅРµС‚ celery/sh/curl), Р»СЋР±РѕР№ healthcheck РїР°РґР°РµС‚ в†’ РєРѕРЅС‚РµР№РЅРµСЂ unhealthy.
    <<: *default-restart
    logging: *default-logging

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: dcap-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

  celery_exporter:
    image: danihodovic/celery-exporter:latest
    container_name: dcap-celery-exporter
    environment:
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0"
    # РѕР±СЂР°Р· danihodovic/celery-exporter РїСЂРёРЅРёРјР°РµС‚ Р±СЂРѕРєРµСЂ РўРћР›Р¬РљРћ CLI-С„Р»Р°РіРѕРј --broker-url (env РЅРµРґРѕСЃС‚Р°С‚РѕС‡РЅРѕ)
    # ENTRYPOINT РѕР±СЂР°Р·Р° danihodovic/celery-exporter = "python /app/cli.py" (docker image inspect),
    # РїРѕСЌС‚РѕРјСѓ РёРјСЏ Р±РёРЅР°СЂРЅРёРєР° РІ command РќР• РїРµСЂРµРґР°С‘Рј вЂ” С‚РѕР»СЊРєРѕ С„Р»Р°РіРё (--broker-url).
    command:
      - "--broker-url"
      - "redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0"
    ports:
      - "${CELERY_EXPORTER_PORT:-9808}:9808"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dcap-network
    <<: *default-restart
    logging: *default-logging

networks:
  dcap-network:
    driver: bridge
    name: dcap-network

volumes:
  postgres_data:
    name: dcap-postgres-data
  redis_data:
    name: dcap-redis-data
  manager_data:
    name: dcap-manager-data
  manager_logs:
    name: dcap-manager-logs
  s3_agent_data:
    name: dcap-s3-agent-data
  s3_agent_logs:
    name: dcap-s3-agent-logs
  linux_agent_data:
    name: dcap-linux-agent-data
  linux_agent_logs:
    name: dcap-linux-agent-logs
  prometheus_data:
    name: dcap-prometheus-data
  grafana_data:
    name: dcap-grafana-data
  samba_data:
    name: dcap-samba-data
  samba_logs:
    name: dcap-samba-logs
