# docker-compose.s3.yml
# S3/MinIO аудит-агент как отдельный сервис DCAP.
version: '3.8'

services:
  s3-agent:
    build:
      # Контекст — корень репо: агент импортирует пакет shared/ (event_schema),
      # поэтому context: ./audit-agent-s3 приводит к ошибке сборки
      # «failed to calculate checksum ... /shared: not found».
      context: .
      dockerfile: audit-agent-s3/Dockerfile
    # 53.3-test-stand-fix: был только build — образ собирался под случайным
    # тегом. Явный image: даёт тот же тег, что и в docker-compose.yml.
    image: dcap/s3-agent:${VERSION:-3.13.37}
    container_name: dcap-s3-agent
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-access-logs/}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_POLL_INTERVAL: ${S3_POLL_INTERVAL:-60}
      S3_MAX_FILES_PER_POLL: ${S3_MAX_FILES_PER_POLL:-100}
      # Ниже — параметры, на которые ссылается config.json, но которые раньше
      # не пробрасывались: агент читал их из env как есть и молча получал
      # дефолт из config.json, из-за чего S3_VERIFY_SSL=false и MAX_ERROR_DELAY
      # из .env не влияли на поведение (Блок 6.3, фикс BUG-120).
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-true}
      S3_SOURCE_TYPE: ${S3_SOURCE_TYPE:-s3}
      MAX_ERROR_DELAY: ${MAX_ERROR_DELAY:-300}
      MANAGER_TIMEOUT: ${MANAGER_TIMEOUT:-30}
      MANAGER_MAX_RETRIES: ${MANAGER_MAX_RETRIES:-3}
      MANAGER_RETRY_DELAY: ${MANAGER_RETRY_DELAY:-5}
      MANAGER_URL: ${MANAGER_URL:-http://manager:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./audit-agent-s3/config:/app/config
      - s3_data:/app/data
      - s3_logs:/app/logs
    networks:
      - dcap-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  s3_data:
    name: dcap-s3-data
  s3_logs:
    name: dcap-s3-logs

networks:
  dcap-network:
    external: true
