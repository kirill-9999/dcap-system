# manager/pyproject.toml
[project]
name = "dcap-manager"
version = "3.0.0"
description = "DCAP Manager"

dependencies = [
    "grpcio>=1.60.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"