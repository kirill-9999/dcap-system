<!-- webui/static/index.html - добавляем секцию создания задания -->
<div id="page-tasks" class="page">
    <h2 class="page-title">📋 Задания</h2>
    
    <!-- Кнопка создания задания -->
    <button class="btn-primary" onclick="showCreateTaskModal()" style="margin-bottom: 1rem;">
        ➕ Создать задание
    </button>
    
    <!-- Модальное окно создания задания -->
    <div id="create-task-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; max-width: 500px; width: 90%; padding: 2rem; border-radius: 12px; max-height: 90vh; overflow-y: auto;">
            <h3 style="margin-bottom: 1rem;">📁 Создание задания</h3>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Путь к папке *</label>
                <input type="text" id="task-path" placeholder="E:\my_data или /home/user/data" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px;">
                <small style="color: #666;">Укажите абсолютный путь к папке для сканирования</small>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Расширения файлов</label>
                <input type="text" id="task-extensions" value="txt,pdf,docx,xlsx,png,jpg,jpeg" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px;">
                <small style="color: #666;">Расширения через запятую</small>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Макс. размер файла (MB)</label>
                <input type="number" id="task-max-size" value="50" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">
                    <input type="checkbox" id="task-recursive" checked> Рекурсивное сканирование
                </label>
            </div>
            
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn-primary" onclick="createTask()" style="flex: 1;">✅ Создать</button>
                <button class="btn-secondary" onclick="closeCreateTaskModal()">Отмена</button>
            </div>
        </div>
    </div>
    
    <!-- Остальной код таблицы заданий -->
    <div class="filter-card">
        <div><label>Статус</label>
            <select id="task-status" onchange="loadTasks()">
                <option value="">Все</option>
                <option value="PENDING">⏳ Ожидает</option>
                <option value="ASSIGNED">🔄 Назначено</option>
                <option value="RUNNING">🔍 Сканируется</option>
                <option value="COMPLETED">✅ Завершено</option>
                <option value="FAILED">❌ Провалено</option>
            </select>
        </div>
    </div>
    <div class="table-card" id="tasks-table"></div>
</div>
