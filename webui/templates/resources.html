{% extends "base.html" %}

{% block title %}Ресурсы - DCAP v3.0{% endblock %}

{% block content %}
<div class="resources-page">
    <h2 class="page-title"><i class="fas fa-folder text-primary"></i> Ресурсы</h2>
    
    <button class="btn btn-primary mb-3" onclick="showModal('create-resource-modal')">
        <i class="fas fa-plus"></i> Добавить ресурс
    </button>
    
    <div class="table-wrapper" id="resources-table">
        <div class="text-center p-4 text-muted"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
    </div>
</div>

<!-- Модалка создания ресурса -->
<div class="modal" id="create-resource-modal">
    <div class="modal-content">
        <h4 class="mb-3"><i class="fas fa-plus-circle"></i> Добавить ресурс</h4>
        <div class="mb-3">
            <label class="form-label">Тип</label>
            <select class="form-select" id="resource-type">
                <option value="FILESYSTEM">Файловая система</option>
                <option value="S3">S3</option>
                <option value="MINIO">MinIO</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Путь</label>
            <input type="text" class="form-control" id="resource-path" placeholder="E:\\data или s3://bucket">
        </div>
        <div class="mb-3">
            <label class="form-label">Расширения</label>
            <input type="text" class="form-control" id="resource-extensions" value="txt,pdf,docx,xlsx,png,jpg,jpeg">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="resource-enabled" checked>
            <label class="form-check-label">Включён</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" onclick="createResource()"><i class="fas fa-check"></i> Добавить</button>
            <button class="btn btn-secondary" onclick="closeModal('create-resource-modal')">Отмена</button>
        </div>
    </div>
</div>

<script>
async function createResource() {
    const path = document.getElementById('resource-path').value.trim();
    if (!path) { alert('⚠️ Укажите путь'); return; }
    
    const data = {
        type: document.getElementById('resource-type').value,
        path: path,
        enabled: document.getElementById('resource-enabled').checked,
        extensions: document.getElementById('resource-extensions').value.trim()
    };
    
    try {
        const r = await fetch('/api/resources/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const res = await r.json();
        if (res.success) {
            alert(`✅ Ресурс добавлен!\nID: ${res.resource_id}`);
            closeModal('create-resource-modal');
            loadResources();
        } else {
            alert(`❌ Ошибка: ${res.detail || 'Неизвестная ошибка'}`);
        }
    } catch(e) { alert(`❌ Ошибка: ${e.message}`); }
}

async function loadResources() {
    try {
        const r = await fetch('/api/resources');
        const resources = await r.json();
        const container = document.getElementById('resources-table');
        
        if (!resources.length) {
            container.innerHTML = '<div class="text-center p-4 text-muted">Нет ресурсов</div>';
            return;
        }
        
        let html = '<div class="table-responsive"><table class="table table-hover table-sm mb-0"><thead class="table-light"><tr><th>ID</th><th>Тип</th><th>Путь</th><th>Статус</th><th>Создан</th></tr></thead><tbody>';
        resources.forEach(r => {
            const status = r.enabled ? '✅ Включён' : '❌ Отключён';
            const created = r.created_at ? new Date(r.created_at).toLocaleString('ru-RU') : '-';
            html += `<tr><td>#${r.id}</td><td>${r.type}</td><td><code>${r.path}</code></td><td>${status}</td><td>${created}</td></tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
        updateTime();
    } catch(e) { console.error(e); }
}

document.addEventListener('DOMContentLoaded', loadResources);
setInterval(loadResources, 30000);
</script>
{% endblock %}
