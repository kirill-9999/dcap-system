<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DCAP Distributed v3.0{% endblock %}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt text-primary"></i>
                DCAP v3.0
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/">
                            <i class="fas fa-chart-pie"></i> Дашборд
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'findings' %}active{% endif %}" href="/findings">
                            <i class="fas fa-search"></i> Находки
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'tasks' %}active{% endif %}" href="/tasks">
                            <i class="fas fa-tasks"></i> Задания
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'scanners' %}active{% endif %}" href="/scanners">
                            <i class="fas fa-server"></i> Сканеры
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="badge bg-success me-2" id="status-badge">
                        <i class="fas fa-circle text-success"></i> Онлайн
                    </span>
                    <span class="text-muted small" id="update-time"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
