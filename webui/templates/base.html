<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DCAP System{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/grid-wireframe.css">
    <link rel="stylesheet" href="/static/css/main.css">
    {% block head %}{% endblock %}
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="sidebar-logo"><span>🛡️</span><span class="hide-on-collapse">DCAP</span></a>
            <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if page == 'Дашборд' %}active{% endif %}" data-page="dashboard">
                <span class="nav-icon"><i class="fas fa-chart-pie"></i></span>
                <span class="nav-label hide-on-collapse">Дашборд</span>
            </a>
            <a href="/catalog" class="nav-item {% if page == 'Каталог' %}active{% endif %}" data-page="catalog">
                <span class="nav-icon"><i class="fas fa-folder-tree"></i></span>
                <span class="nav-label hide-on-collapse">Каталог</span>
            </a>
            <a href="/findings" class="nav-item {% if page == 'Находки' %}active{% endif %}" data-page="findings">
                <span class="nav-icon"><i class="fas fa-exclamation-triangle"></i></span>
                <span class="nav-label hide-on-collapse">Находки</span>
            </a>
            <a href="/false-positives" class="nav-item {% if page == 'Ложные срабатывания' %}active{% endif %}" data-page="false-positives">
                <span class="nav-icon"><i class="fas fa-ban"></i></span>
                <span class="nav-label hide-on-collapse">Ложные</span>
            </a>
            <a href="/resources" class="nav-item {% if page == 'Ресурсы' %}active{% endif %}" data-page="resources">
                <span class="nav-icon"><i class="fas fa-database"></i></span>
                <span class="nav-label hide-on-collapse">Ресурсы</span>
            </a>
            <a href="/audit" class="nav-item {% if page == 'Аудит' %}active{% endif %}" data-page="audit">
                <span class="nav-icon"><i class="fas fa-history"></i></span>
                <span class="nav-label hide-on-collapse">Аудит</span>
            </a>
            <a href="/access" class="nav-item {% if page == 'Доступ' %}active{% endif %}" data-page="access">
                <span class="nav-icon"><i class="fas fa-lock"></i></span>
                <span class="nav-label hide-on-collapse">Доступ</span>
            </a>
            <a href="/scanners" class="nav-item {% if page == 'Сканеры' %}active{% endif %}" data-page="scanners">
                <span class="nav-icon"><i class="fas fa-microscope"></i></span>
                <span class="nav-label hide-on-collapse">Сканеры</span>
            </a>
            <div class="nav-divider nav-admin hide-on-collapse" style="display:none;"></div>
            <a href="/users" class="nav-item nav-admin {% if page == 'Пользователи' %}active{% endif %}" data-page="users" style="display:none;">
                <span class="nav-icon"><i class="fas fa-users"></i></span>
                <span class="nav-label hide-on-collapse">Пользователи</span>
            </a>
            <a href="/roles" class="nav-item nav-admin {% if page == 'Роли' %}active{% endif %}" data-page="roles" style="display:none;">
                <span class="nav-icon"><i class="fas fa-lock"></i></span>
                <span class="nav-label hide-on-collapse">Роли</span>
            </a>
            <a href="/settings" class="nav-item nav-admin {% if page == 'Настройки' %}active{% endif %}" data-page="settings" style="display:none;">
                <span class="nav-icon"><i class="fas fa-cog"></i></span>
                <span class="nav-label hide-on-collapse">Настройки</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div>
                    <div class="user-name hide-on-collapse" id="currentUserName">...</div>
                    <div class="user-roles hide-on-collapse" id="currentUserRoles" style="font-size:11px;opacity:.8;"></div>
                </div>
            </div>
            <div class="sidebar-actions hide-on-collapse">
                <button onclick="Auth && Auth.logout()" title="Выход"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </aside>
    <main class="main-content" id="mainContent">
        <header class="page-header">
            <div class="header-left">
                <nav aria-label="Breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item active">{{ page|default('Главная') }}</li>
                    </ol>
                </nav>
            </div>
            <div class="header-right">
                <span class="text-muted" style="font-size:var(--font-size-xs)" id="lastUpdated"></span>
            </div>
        </header>
        <div class="page-content">{% block content %}{% endblock %}</div>
        <footer class="page-footer">
            <span>DCAP System <span id="footerVersion">v3.0.0</span></span>
            <span>|</span>
            <span id="footerTime"></span>
        </footer>
    </main>
</div>
<script src="/static/vendor/js/chart.umd.min.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/main.js"></script>
<script>
// Защита страниц: если не авторизованы — редирект на /login
document.addEventListener('DOMContentLoaded', async () => {
    if (window.location.pathname !== '/login' && typeof Auth !== 'undefined') {
        const ok = await Auth.check();
        if (ok) {
            // Имя пользователя и роли
            try {
                const me = await Auth.me();
                if (me) {
                    const nameEl = document.getElementById('currentUserName');
                    if (nameEl) nameEl.textContent = me.full_name || me.username || 'Пользователь';
                    const rolesEl = document.getElementById('currentUserRoles');
                    if (rolesEl && me.roles) rolesEl.textContent = me.roles.join(', ');
                    // Показывать админ-разделы только для admin
                    const isAdmin = (me.roles || []).includes('admin');
                    document.querySelectorAll('.nav-admin').forEach(el => {
                        el.style.display = isAdmin ? '' : 'none';
                    });
                }
            } catch (e) {}
        }
    }
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
