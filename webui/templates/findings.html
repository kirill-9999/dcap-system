{% extends "base.html" %}
{% block title %}Находки — DCAP{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0"><i class="fas fa-search text-primary me-2"></i>Находки</h2>
    <div>
      <button class="btn btn-outline-secondary btn-sm" id="export-btn">
        <i class="fas fa-download me-1"></i>Экспорт
      </button>
    </div>
  </div>

  <button class="btn btn-outline-secondary btn-sm mb-2" id="filters-toggle" type="button"
          aria-expanded="false" aria-controls="filtersCollapse" onclick="toggleFindingsFilters(this)">
    <i class="fas fa-filter me-1"></i>Фильтры
  </button>

  <div class="filter-card mb-3" id="filtersCollapse">
    <div class="row g-2 mb-2">
      <div class="col-md-4">
        <label class="form-label small">Поиск</label>
        <input type="text" class="form-control form-control-sm" id="filter-search"
               placeholder="путь или значение" autocomplete="off">
      </div>
      <div class="col-md-2">
        <label class="form-label small">Категория (через запятую)</label>
        <input type="text" class="form-control form-control-sm" id="filter-category" placeholder="phone, email..." autocomplete="off">
      </div>
      <div class="col-md-2">
        <label class="form-label small">Детектор</label>
        <select class="form-select form-select-sm" id="filter-detector">
          <option value="">Все</option>
          <option value="regex">regex</option>
          <option value="presidio">presidio</option>
          <option value="entropy">entropy</option>
          <option value="ocr">ocr</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Фрагмент</label>
        <select class="form-select form-select-sm" id="filter-fragment">
          <option value="">Все</option>
          <option value="text_line">Строка</option>
          <option value="text_context">Контекст</option>
          <option value="image_region">Изображение</option>
          <option value="byte_range">Байты</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Задание</label>
        <input type="number" class="form-control form-control-sm" id="filter-task" placeholder="ID">
      </div>
    </div>
    <div class="row g-2">
      <div class="col-md-2">
        <label class="form-label small">Статус</label>
        <select class="form-select form-select-sm" id="filter-status">
          <option value="">Все</option>
          <option value="new">🆕 Новые</option>
          <option value="confirmed">✅ Подтверждённые</option>
          <option value="false_positive">❌ Ложные</option>
          <option value="archived">📦 Архив</option>
          <option value="duplicate">♻️ Дубли (ротация ключа)</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Тип</label>
        <select class="form-select form-select-sm" id="filter-type">
          <option value="">Все</option>
          <option value="pii">PII</option>
          <option value="credentials">Credentials</option>
          <option value="code">Code</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Severity</label>
        <select class="form-select form-select-sm" id="filter-severity">
          <option value="">Все</option>
          <option value="critical">🔴 Critical</option>
          <option value="high">🟠 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
      <div class="col-md-3 d-flex align-items-end gap-2">
        <button class="btn btn-primary btn-sm flex-fill" id="apply-filters">Применить</button>
        <button class="btn btn-outline-secondary btn-sm flex-fill" id="reset-filters" title="Сбросить фильтры">
          <i class="fas fa-undo me-1"></i>Сброс
        </button>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filter-show-fp">
          <label class="form-check-label small" for="filter-show-fp" title="BACKLOG-115: ложные срабатывания скрыты по умолчанию">Показывать ложные срабатывания</label>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-2" id="bulk-actions" style="display: none;">
    <div class="card-body py-2">
      <span class="me-3">Выбрано: <strong id="selected-count">0</strong></span>
      <button class="btn btn-success btn-sm" id="bulk-confirm"><i class="fas fa-check me-1"></i>Подтвердить</button>
      <button class="btn btn-danger btn-sm" id="bulk-fp"><i class="fas fa-times me-1"></i>Ложное</button>
      <button class="btn btn-outline-secondary btn-sm" id="bulk-clear">Снять выбор</button>
    </div>
  </div>

  <div id="findings-list">
    <div class="text-center py-5">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2 text-muted">Загрузка...</p>
    </div>
  </div>

  <nav class="mt-3" id="pagination-wrap" style="display:none;">
    <p class="text-center text-muted small mb-1" id="pagination-count">Всего: 0</p>
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>
</div>
{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/css/findings.css">
{% endblock %}
{% block scripts %}
<script src="/static/js/findings.js"></script>
{% endblock %}
