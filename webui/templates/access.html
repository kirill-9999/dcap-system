{% extends "base.html" %}
{% block title %}DCAP — Доступ{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-lock text-primary"></i> Управление доступом</h2>

<div class="kpi-grid mb-4">
    <div class="kpi-card"><div class="kpi-icon" style="color:var(--color-primary);background:var(--color-primary-bg)"><i class="fas fa-database"></i></div><div><div class="kpi-value" id="ac-resources">—</div><div class="kpi-label">Ресурсов</div></div></div>
    <div class="kpi-card"><div class="kpi-icon" style="color:var(--color-danger);background:var(--color-danger-bg)"><i class="fas fa-triangle-exclamation"></i></div><div><div class="kpi-value" id="ac-open-alerts">—</div><div class="kpi-label">Открытых алертов</div></div></div>
    <div class="kpi-card"><div class="kpi-icon" style="color:var(--color-warning);background:var(--color-warning-bg)"><i class="fas fa-circle-exclamation"></i></div><div><div class="kpi-value" id="ac-critical">—</div><div class="kpi-label">Критичных</div></div></div>
</div>

<h4 class="mb-3">Ресурсы и права</h4>
<div class="table-wrapper mb-4" id="access-resources-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>

<div id="entries-panel" style="display:none;">
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Права доступа: <code id="entries-resource-path"></code></span>
            <button class="btn btn-sm btn-outline-secondary" onclick="closeEntries()">&times;</button>
        </div>
        <div class="card-body" id="entries-body"></div>
    </div>
</div>

<h4 class="mb-3">Алерты безопасности</h4>
<div class="filter-card mb-3">
    <div class="row g-3 align-items-end">
        <div class="col-md-3"><label class="form-label">Важность</label>
            <select class="form-select" id="al-severity" onchange="loadAlerts()">
                <option value="">Все</option><option value="critical">Критичные</option>
                <option value="warning">Предупреждения</option><option value="info">Инфо</option>
            </select></div>
        <div class="col-md-3"><label class="form-label">Статус</label>
            <select class="form-select" id="al-status" onchange="loadAlerts()">
                <option value="">Все</option><option value="open">Открыт</option>
                <option value="acknowledged">Принят</option><option value="resolved">Решён</option><option value="ignored">Игнорируется</option>
            </select></div>
        <div class="col-md-3"><label class="form-check-label">&nbsp;</label>
            <div><button class="btn btn-outline-secondary w-100" onclick="resetAlerts()"><i class="fas fa-undo"></i> Сброс</button></div></div>
    </div>
</div>
<div class="table-wrapper" id="access-alerts-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/access.js"></script>
{% endblock %}
