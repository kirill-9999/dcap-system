<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — DCAP System</title>
    <link rel="stylesheet" href="/static/vendor/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/grid-wireframe.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body.login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-page-ink);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: var(--radius-cards);
            box-shadow: none;
        }
        .login-card .card-header {
            border-bottom: 1px solid var(--color-steel-border);
            text-align: center;
            padding: 32px 24px 16px;
            background: transparent;
        }
        .login-card .card-header h4 { margin-bottom: 4px; color: var(--color-snow); }
        .login-card .card-body { padding: 16px 32px 32px; }
        #modeBadge { font-size: 0.8rem; }
    </style>
</head>
<body class="login-body">
    <div class="card login-card">
        <div class="card-header">
            <div style="font-size:2rem">🛡️</div>
            <h4>DCAP System</h4>
            <p class="text-muted" style="font-size:0.85rem">Вход в систему</p>
            <span id="modeBadge" class="badge bg-secondary"></span>
        </div>
        <div class="card-body">
            <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="loginBtn">Войти</button>
            </form>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script>
        const usernameEl = document.getElementById('username');
        const passwordEl = document.getElementById('password');
        const errorBox = document.getElementById('errorBox');
        const loginBtn = document.getElementById('loginBtn');

        // Режим аутентификации (для подсказки)
        // BACKLOG-119 (v3.13.41): badge показываем только для windows_integrated;
        // для local/hybrid — скрываем («Гибридный режим» избыточен).
        fetch('/api/auth/mode')
            .then(r => r.json())
            .then(d => {
                const b = document.getElementById('modeBadge');
                if (d.mode === 'windows_integrated') {
                    b.textContent = 'Windows Authentication';
                    b.style.display = '';
                } else {
                    b.style.display = 'none';
                }
            })
            .catch(() => {});

        // Если уже авторизованы — на главную
        if (Auth.isAuthenticated()) {
            window.location.href = '/';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('d-none');
            loginBtn.disabled = true;
            try {
                await Auth.login(usernameEl.value.trim(), passwordEl.value);
                window.location.href = '/';
            } catch (err) {
                errorBox.textContent = err.message || 'Ошибка входа';
                errorBox.classList.remove('d-none');
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
