<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — DCAP System</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <link rel="apple-touch-icon" href="/static/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/vendor/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/grid-wireframe.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body.login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-page-ink);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: var(--radius-cards);
            box-shadow: none;
        }
        .login-card .card-header {
            border-bottom: 1px solid var(--color-steel-border);
            text-align: center;
            padding: 32px 24px 16px;
            background: transparent;
        }
        .login-card .card-header h4 { margin-bottom: 4px; color: var(--color-snow); }
        .login-card .card-body { padding: 16px 32px 32px; }
        #modeBadge { font-size: 0.8rem; }
        /* BUG-146 (v3.14.0): login не «наезжает» на мобильных —
           flex + gap, панель не выходит за вьюпорт, скролл при нехватке высоты */
        @media (max-width: 480px) {
            body.login-body {
                align-items: flex-start;
                justify-content: flex-start;
                padding: 24px 16px;
                overflow-y: auto;
            }
            .login-card {
                max-width: 100%;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
            }
            .login-card .card-body {
                padding: 16px 20px 28px;
            }
            .login-card .card-header {
                padding: 24px 20px 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
        }
    </style>
</head>
<body class="login-body">
    <div class="card login-card">
        <div class="card-header">
            <div style="font-size:2rem">🛡️</div>
            <h4>DCAP System</h4>
            <p class="text-muted" style="font-size:0.85rem">Вход в систему</p>
            <span id="modeBadge" class="badge bg-secondary"></span>
        </div>
        <div class="card-body">
            <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="loginBtn">Войти</button>
            </form>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
