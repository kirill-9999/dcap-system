{% extends "base.html" %}
{% block title %}DCAP — Аудит{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-history text-primary"></i> События аудита</h2>
<div class="kpi-grid mb-4">
    <div class="kpi-card"><div class="kpi-icon" style="color:var(--color-primary);background:var(--color-primary-bg)"><i class="fas fa-database"></i></div><div><div class="kpi-value" id="a-total">—</div><div class="kpi-label">Всего событий</div></div></div>
    <div class="kpi-card"><div class="kpi-icon" style="color:var(--color-success);background:var(--color-success-bg)"><i class="fas fa-server"></i></div><div><div class="kpi-value" id="a-agents">—</div><div class="kpi-label">Агентов онлайн</div></div></div>
</div>
<div class="filter-card mb-3">
    <div class="row g-3 align-items-end">
        <div class="col-md-3"><label class="form-label">Источник</label><select class="form-select" id="a-source" onchange="loadAudit(0)"><option value="">Все</option></select></div>
        <div class="col-md-3"><label class="form-label">Тип события</label><select class="form-select" id="a-type" onchange="loadAudit(0)"><option value="">Все</option></select></div>
        <div class="col-md-2"><label class="form-label">Пользователь</label><input type="text" class="form-control" id="a-user" placeholder="имя..." onkeyup="loadAudit(0)"></div>
        <div class="col-md-2" id="a-role-wrap" style="display:none;"><label class="form-label">Роль</label><select class="form-select" id="a-role" onchange="loadAudit(0)"><option value="">Все</option></select></div>
        <div class="col-md-2"><button class="btn btn-outline-secondary w-100" onclick="resetAuditFilters()"><i class="fas fa-undo"></i> Сброс</button></div>
    </div>
</div>
<div class="table-wrapper" id="audit-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>
<div class="text-center my-3">
    <button class="btn btn-outline-primary" id="audit-more" style="display:none" onclick="loadAudit(null, true)"><i class="fas fa-ellipsis-h"></i> Показать ещё</button>
</div>

<div class="modal" id="audit-event-modal">
    <div class="modal-content">
        <div class="modal-header"><h3>Событие аудита <span id="ae-id"></span></h3><button class="btn btn-sm" onclick="closeModal('audit-event-modal')">&times;</button></div>
        <div class="modal-body" id="ae-body"><div class="text-center py-3"><div class="spinner-border"></div></div></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
// BUG-184 (v3.14.1): типы событий сгруппированы, а не плоский список.
var TYPE_GROUPS = {
    'Находки': ['finding_reveal', 'fragment_accessed', 'finding_status_change', 'finding_export'],
    'Файловые операции': ['read', 'write', 'delete', 'move', 'copy', 'create'],
    'Аутентификация': ['login', 'logout', 'login_failed', 'password_change'],
    'Сканирование': ['task_started', 'task_completed', 'task_failed', 'scan_started', 'scan_completed', 'scan_failed'],
    'Управление (RBAC)': ['user_created', 'user_updated', 'user_deleted', 'user_status_change', 'role_created', 'role_updated', 'role_deleted', 'resource_created', 'resource_deleted'],
    'Архивация/экспорт': ['retention_run', 'archive_export', 'report_export'],
};
var TYPE_LABELS = {
    finding_reveal: 'просмотр оригинала', fragment_accessed: 'доступ к фрагменту',
    finding_status_change: 'смена статуса находки', finding_export: 'экспорт находок',
    read: 'чтение', write: 'запись', delete: 'удаление', move: 'перемещение', copy: 'копирование',
    login: 'вход', logout: 'выход', login_failed: 'неудачный вход',
    task_started: 'задание запущено', task_completed: 'задание завершено', task_failed: 'задание провалено',
    user_created: 'пользователь создан', user_updated: 'пользователь изменён',
    resource_created: 'ресурс создан', resource_deleted: 'ресурс удалён',
    retention_run: 'архивация', report_export: 'экспорт отчёта',
};
var _auditOffset = 0;
var _auditEvents = [];
var _userRoles = null;
var _filterOptsLoaded = false;

function typeLabel(t) { return TYPE_LABELS[t] ? (t + ' — ' + TYPE_LABELS[t]) : t; }

async function loadFilterOptions() {
    if (_filterOptsLoaded) return;
    try {
        var st = await api.get('/api/audit/stats', {days: 30});
        fillSource('a-source', (st.by_source || []).map(function (x) { return x.source; }));
        fillTypes('a-type', (st.by_type || []).map(function (x) { return x.type; }));
        _filterOptsLoaded = true;
    } catch (e) { /* статистика недоступна — фильтры остаются пустыми */ }
}

// BUG-182 (v3.14.1): фильтр по роли — сопоставляем event.user с ролями
// учётных записей. Список пользователей доступен только Admin; для аудитора
// без прав — фильтр по роли скрыт.
async function loadUserRoles() {
    try {
        var r = await api.get('/api/auth/users', {limit: 1000});
        var users = (r && r.items) ? r.items : (Array.isArray(r) ? r : []);
        _userRoles = {};
        var allRoles = {};
        users.forEach(function (u) {
            var names = (u.roles || []).map(function (x) { return typeof x === 'string' ? x : (x.name || ''); });
            _userRoles[u.username] = names;
            names.forEach(function (n) { if (n) allRoles[n] = 1; });
        });
        var sel = document.getElementById('a-role');
        Object.keys(allRoles).sort().forEach(function (n) {
            var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o);
        });
        document.getElementById('a-role-wrap').style.display = '';
    } catch (e) { /* нет прав — фильтр по роли недоступен */ }
}

function fillSource(id, values) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var seen = {};
    sel.innerHTML = '<option value="">Все</option>';
    values.forEach(function (v) {
        if (!v || seen[v]) return; seen[v] = 1;
        var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
    });
}

// Группировка типов в optgroup (BUG-184).
function fillTypes(id, values) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var known = {}, groups = {};
    sel.innerHTML = '<option value="">Все</option>';
    values.forEach(function (v) {
        if (!v || known[v]) return; known[v] = 1;
        var g = 'Прочие';
        for (var name in TYPE_GROUPS) { if (TYPE_GROUPS[name].indexOf(v) !== -1) { g = name; break; } }
        (groups[g] = groups[g] || []).push(v);
    });
    Object.keys(groups).forEach(function (g) {
        var og = document.createElement('optgroup'); og.label = g;
        groups[g].forEach(function (v) {
            var o = document.createElement('option'); o.value = v; o.textContent = typeLabel(v); og.appendChild(o);
        });
        sel.appendChild(og);
    });
}

async function loadAudit(offset, append) {
    if (offset === null || offset === undefined && !append) offset = _auditOffset;
    if (!append) { _auditOffset = 0; _auditEvents = []; }
    try {
        var src = document.getElementById('a-source')?.value || '';
        var tp = document.getElementById('a-type')?.value || '';
        var usr = document.getElementById('a-user')?.value?.trim() || '';
        var d = await api.get('/api/audit', {limit: 200, offset: _auditOffset, event_source: src, event_type: tp, user: usr});
        var events = d.events || [];
        _auditOffset += events.length;
        _auditEvents = _auditEvents.concat(events);
        document.getElementById('a-total').textContent = d.total != null ? d.total : _auditEvents.length;
        var agentsResp = await api.get('/api/audit/agents');
        document.getElementById('a-agents').textContent = agentsResp.online || 0;
        renderAuditTable();
        var more = document.getElementById('audit-more');
        more.style.display = _auditEvents.length < (d.total || 0) ? '' : 'none';
    } catch(e) { console.error(e); }
}

function applyRole(event) {
    var role = document.getElementById('a-role') ? document.getElementById('a-role').value : '';
    if (!role || !_userRoles) return true;
    var roles = _userRoles[event.user] || [];
    return roles.indexOf(role) !== -1;
}

function renderAuditTable() {
    var c = document.getElementById('audit-table');
    var events = _auditEvents.filter(applyRole);
    if (!events.length) { c.innerHTML = '<div class="text-center p-4 text-muted">Нет событий</div>'; return; }
    var html = '<div class="table-responsive"><table class="table table-sm"><thead><tr><th>Время</th><th>Пользователь</th><th>Файл</th><th>Тип</th><th>Источник</th><th>Хост</th><th></th></tr></thead><tbody>';
    for (var i = 0; i < events.length; i++) {
        var e = events[i];
        var t = formatDate(e.created_at);
        var hasMeta = e.metadata && Object.keys(e.metadata).length;
        html += '<tr class="audit-row" style="cursor:pointer" onclick="showAuditEvent('+e.id+')">'
            + '<td>'+t+'</td><td>'+(e.user||'—')+'</td>'
            + '<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(e.file_path||'')+'</td>'
            + '<td><span class="badge badge-primary" title="'+(e.event_type||'')+'">'+typeLabel(e.event_type||'')+'</span></td>'
            + '<td>'+(e.event_source||'')+'</td><td>'+(e.source_host||'—')+'</td>'
            + '<td class="text-end">' + (hasMeta ? '<button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation();showAuditEvent('+e.id+')" title="Показать metadata"><i class="fas fa-code"></i></button>' : '') + '</td></tr>';
    }
    c.innerHTML = html + '</tbody></table></div>';
}

async function showAuditEvent(id) {
    var body = document.getElementById('ae-body');
    document.getElementById('ae-id').textContent = '#' + id;
    body.innerHTML = '<div class="text-center py-3"><div class="spinner-border"></div></div>';
    openModal('audit-event-modal');
    try {
        var e = await api.get('/api/audit/' + id);
        var meta = e.metadata_json || e.metadata || {};
        body.innerHTML =
            '<dl class="row small mb-2">'
            + '<dt class="col-sm-3">Время</dt><dd class="col-sm-9">' + formatDate(e.created_at) + '</dd>'
            + '<dt class="col-sm-3">Тип</dt><dd class="col-sm-9">' + escapeHtml(typeLabel(e.event_type || '')) + '</dd>'
            + '<dt class="col-sm-3">Источник</dt><dd class="col-sm-9">' + escapeHtml(e.event_source || '—') + '</dd>'
            + '<dt class="col-sm-3">Пользователь</dt><dd class="col-sm-9">' + escapeHtml(e.user || '—') + (e.user_sid ? ' <span class="text-muted">(' + escapeHtml(e.user_sid) + ')</span>' : '') + '</dd>'
            + '<dt class="col-sm-3">Файл</dt><dd class="col-sm-9"><code>' + escapeHtml(e.file_path || '—') + '</code></dd>'
            + (e.old_path ? '<dt class="col-sm-3">Было</dt><dd class="col-sm-9"><code>' + escapeHtml(e.old_path) + '</code></dd>' : '')
            + '<dt class="col-sm-3">Хост</dt><dd class="col-sm-9">' + escapeHtml(e.source_host || '—') + '</dd>'
            + '</dl>'
            + '<h6>metadata</h6><pre class="small" style="max-height:320px;overflow:auto">' + escapeHtml(JSON.stringify(meta, null, 2)) + '</pre>';
    } catch (err) {
        body.innerHTML = '<div class="alert alert-danger">' + escapeHtml(errorToRussian(err.message)) + '</div>';
    }
}

function resetAuditFilters() {
    document.getElementById('a-source').value = '';
    document.getElementById('a-type').value = '';
    document.getElementById('a-user').value = '';
    var role = document.getElementById('a-role');
    if (role) role.value = '';
    loadAudit(0);
}

document.addEventListener('DOMContentLoaded', async function () {
    if (typeof whenSessionReady === 'function') { try { await whenSessionReady(); } catch (e) {} }
    await loadFilterOptions();
    await loadUserRoles();
    await loadAudit(0);
});
</script>
{% endblock %}
