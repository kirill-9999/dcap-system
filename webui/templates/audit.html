{% extends "base.html" %}
{% block title %}DCAP — Аудит{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-history text-primary"></i> События аудита</h2>
<div class="kpi-grid mb-4">
    <div class="kpi-card"><div class="kpi-icon" style="color:var(--color-primary);background:var(--color-primary-bg)"><i class="fas fa-database"></i></div><div><div class="kpi-value" id="a-total">—</div><div class="kpi-label">Всего событий</div></div></div>
    <div class="kpi-card"><div class="kpi-icon" style="color:var(--color-success);background:var(--color-success-bg)"><i class="fas fa-server"></i></div><div><div class="kpi-value" id="a-agents">—</div><div class="kpi-label">Агентов онлайн</div></div></div>
</div>
<div class="filter-card mb-3">
    <div class="row g-3 align-items-end">
        <div class="col-md-3"><label class="form-label">Источник</label><select class="form-select" id="a-source" onchange="loadAudit(0)"><option value="">Все</option></select></div>
        <div class="col-md-3"><label class="form-label">Тип события</label><select class="form-select" id="a-type" onchange="loadAudit(0)"><option value="">Все</option></select></div>
        <div class="col-md-2"><label class="form-label">Пользователь</label><input type="text" class="form-control" id="a-user" placeholder="имя..." onkeyup="loadAudit(0)"></div>
        <div class="col-md-2" id="a-role-wrap" style="display:none;"><label class="form-label">Роль</label><select class="form-select" id="a-role" onchange="loadAudit(0)"><option value="">Все</option></select></div>
        <div class="col-md-2"><button class="btn btn-outline-secondary w-100" onclick="resetAuditFilters()"><i class="fas fa-undo"></i> Сброс</button></div>
    </div>
</div>
<div class="table-wrapper" id="audit-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>
<div class="text-center my-3">
    <button class="btn btn-outline-primary" id="audit-more" style="display:none" onclick="loadAudit(null, true)"><i class="fas fa-ellipsis-h"></i> Показать ещё</button>
</div>

<div class="modal" id="audit-event-modal">
    <div class="modal-content">
        <div class="modal-header"><h3>Событие аудита <span id="ae-id"></span></h3><button class="btn btn-sm" onclick="closeModal('audit-event-modal')">&times;</button></div>
        <div class="modal-body" id="ae-body"><div class="text-center py-3"><div class="spinner-border"></div></div></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/audit.js"></script>
{% endblock %}
