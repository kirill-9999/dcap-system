{% extends "base.html" %}
{% block title %}Каталог — DCAP{% endblock %}
{% block content %}
<div class="container-fluid">
  <h2 class="mb-3"><i class="fas fa-folder-tree text-primary me-2"></i>Каталог</h2>

  <div class="filter-card mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-6">
        <label class="form-label small">Поиск по пути</label>
        <input type="text" class="form-control form-control-sm" id="catalog-search" placeholder="путь или часть пути..." onkeyup="CatalogPage.applyFilters()">
      </div>
      <div class="col-md-3">
        <label class="form-label small">Категория</label>
        <select class="form-select form-select-sm" id="catalog-category" onchange="CatalogPage.applyFilters()">
          <option value="">Все</option>
          <option value="pii">PII</option>
          <option value="credentials">Credentials</option>
          <option value="code">Code</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-outline-secondary btn-sm w-100" onclick="CatalogPage.reset()">
          <i class="fas fa-undo"></i> Сброс
        </button>
      </div>
    </div>
  </div>

  <div id="catalog-tree">
    <div class="text-center py-5">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2 text-muted">Загрузка...</p>
    </div>
  </div>
</div>
{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/css/findings.css">
{% endblock %}
{% block scripts %}
<script src="/static/js/catalog.js"></script>
{% endblock %}
