{% extends "base.html" %}
{% block title %}DCAP — Пользователи{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-users text-primary"></i> Пользователи</h2>
<button class="btn btn-primary mb-3" onclick="showCreateUserModal()"><i class="fas fa-plus"></i> Создать</button>

<div class="row mb-3 g-2">
    <div class="col-md-4">
        <input type="text" id="searchUsers" class="form-control" placeholder="Поиск..." oninput="loadUsers(0)">
    </div>
    <div class="col-md-3">
        <select id="filterSource" class="form-select" onchange="loadUsers(0)">
            <option value="">Все источники</option>
            <option value="local">Локальные</option>
            <option value="ad">AD</option>
        </select>
    </div>
    <div class="col-md-3">
        <select id="filterRole" class="form-select" onchange="loadUsers(0)">
            <option value="">Все роли</option>
            <option value="admin">Admin</option>
            <option value="auditor">Auditor</option>
            <option value="scanner">Scanner</option>
            <option value="viewer">Viewer</option>
        </select>
    </div>
</div>

<div class="table-wrapper">
    <div class="table-responsive">
        <table class="table table-sm">
            <thead><tr><th>Имя пользователя</th><th>Полное имя</th><th>Email</th><th>Источник</th><th>Роли</th><th>Статус</th><th></th></tr></thead>
            <tbody id="usersTableBody"><tr><td colspan="7" class="text-center text-muted">Загрузка...</td></tr></tbody>
        </table>
    </div>
</div>

<div class="d-flex align-items-center justify-content-between mt-2">
    <span id="pageInfo" class="text-muted" style="font-size:13px;"></span>
    <div class="btn-group">
        <button class="btn btn-outline-secondary btn-sm" onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
        <button class="btn btn-outline-secondary btn-sm" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<div class="modal" id="userModal">
    <div class="modal-content">
        <div class="modal-header"><h3 id="userModalTitle">Создание пользователя</h3><button class="btn btn-sm" onclick="closeModal('userModal')">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="userId">
            <div class="mb-3"><label class="form-label">Имя пользователя *</label><input type="text" id="username" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Полное имя</label><input type="text" id="fullName" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control"></div>
            <div class="mb-3" id="passwordGroup"><label class="form-label">Пароль</label><input type="password" id="password" class="form-control"><small class="text-muted">Оставьте пустым, если не нужно менять</small></div>
            <div class="mb-3"><label class="form-label">Источник</label>
                <select id="authSource" class="form-select" onchange="togglePasswordRequired()">
                    <option value="local">Локальный</option>
                    <option value="ad">AD</option>
                </select>
            </div>
            <div class="mb-3"><label class="form-label">Роли</label><div id="rolesCheckboxes"></div></div>
            <div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="isActive" checked><label class="form-check-label" for="isActive">Активен</label></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline-secondary" onclick="closeModal('userModal')">Отмена</button>
            <button class="btn btn-primary" onclick="saveUser()">Сохранить</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/users.js"></script>
{% endblock %}
