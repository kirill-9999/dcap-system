{% extends "base.html" %}
{% block title %}DCAP — Сканеры{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-microscope text-primary"></i> Сканеры и агенты</h2>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Сканеры</h4>
    <button class="btn btn-outline-danger btn-sm" id="delete-inactive-btn" style="display:none" onclick="deleteInactiveScanners()">
        <i class="fas fa-trash"></i> Удалить неактивные (<span id="inactive-count">0</span>)
    </button>
</div>
<div class="table-wrapper mb-4" id="scanners-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>

<h4 class="mb-3">Агенты аудита</h4>
<div class="table-wrapper" id="agents-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/scanners.js"></script>
{% endblock %}
