{% extends "base.html" %}
{% block title %}DCAP — Сканеры{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-microscope text-primary"></i> Сканеры и агенты</h2>
<h4 class="mb-3">Сканеры</h4>
<div class="table-wrapper mb-4" id="scanners-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>
<h4 class="mb-3">Агенты аудита</h4>
<div class="table-wrapper" id="agents-table"><div class="text-center p-4 text-muted">Загрузка...</div></div>
{% endblock %}
{% block scripts %}
<script>
async function loadScannersPage() {
    var scanners = await api.get('/api/scanners');
    var c = document.getElementById('scanners-table');
    if (!scanners.length) { c.innerHTML = '<div class="text-center p-4 text-muted">Нет сканеров</div>'; return; }
    var html = '<div class="table-responsive"><table class="table table-sm"><thead><tr><th>ID</th><th>Имя</th><th>Статус</th><th>Heartbeat</th><th>Заданий</th></tr></thead><tbody>';
    for (var i = 0; i < scanners.length; i++) {
        var s = scanners[i];
        var sc = s.status === 'active' ? 'online' : 'offline';
        var hb = s.last_heartbeat ? new Date(s.last_heartbeat).toLocaleString('ru-RU') : '-';
        html += '<tr><td>#'+s.id+'</td><td>'+s.name+'</td><td><span class="status-badge '+sc+'">'+s.status+'</span></td><td>'+hb+'</td><td>'+((s.total_files_scanned||0))+'</td></tr>';
    }
    c.innerHTML = html + '</tbody></table></div>';

    var agentsResp = await api.get('/api/audit/agents');
    var agents = agentsResp.agents || [];
    var c2 = document.getElementById('agents-table');
    if (!agents.length) { c2.innerHTML = '<div class="text-center p-4 text-muted">Нет агентов</div>'; return; }
    var html2 = '<div class="table-responsive"><table class="table table-sm"><thead><tr><th>ID</th><th>Имя</th><th>Хост</th><th>Статус</th><th>Событий</th><th>Heartbeat</th></tr></thead><tbody>';
    for (var i = 0; i < agents.length; i++) {
        var a = agents[i];
        var sc = a.status === 'online' ? 'online' : 'offline';
        var hb = a.last_heartbeat ? new Date(a.last_heartbeat).toLocaleString('ru-RU') : '-';
        html2 += '<tr><td>#'+a.id+'</td><td><strong>'+a.name+'</strong></td><td>'+a.hostname+'</td><td><span class="status-badge '+sc+'">'+a.status+'</span></td><td>'+(a.events_sent||0)+'</td><td>'+hb+'</td></tr>';
    }
    c2.innerHTML = html2 + '</tbody></table></div>';
}
document.addEventListener('DOMContentLoaded', loadScannersPage);
</script>
{% endblock %}
