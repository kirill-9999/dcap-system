{% extends "base.html" %}

{% block title %}Сканеры - DCAP v3.0{% endblock %}

{% block content %}
<div class="scanners-page">
    <h2 class="page-title"><i class="fas fa-server text-primary"></i> Сканеры</h2>
    
    <div class="table-wrapper" id="scanners-table">
        <div class="text-center p-4 text-muted"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
    </div>
</div>

<script>
async function loadScanners() {
    try {
        const r = await fetch('/api/scanners');
        const scanners = await r.json();
        const container = document.getElementById('scanners-table');
        
        if (!scanners.length) {
            container.innerHTML = '<div class="text-center p-4 text-muted">Нет сканеров</div>';
            return;
        }
        
        let html = '<div class="table-responsive"><table class="table table-hover table-sm mb-0"><thead class="table-light"><tr><th>ID</th><th>Имя</th><th>Статус</th><th>Endpoint</th><th>Heartbeat</th><th>Файлов</th><th>Находок</th></tr></thead><tbody>';
        scanners.forEach(s => {
            const online = s.status === 'ACTIVE' || s.status === 'active';
            const badge = online ? 'success' : 'secondary';
            const statusText = online ? '🟢 Активен' : '⚪ Оффлайн';
            const hb = s.last_heartbeat ? new Date(s.last_heartbeat).toLocaleString('ru-RU') : '-';
            html += `<tr><td>#${s.id}</td><td>${s.name}</td><td><span class="badge bg-${badge}">${statusText}</span></td><td><code>${s.endpoint}</code></td><td>${hb}</td><td>${s.total_files_scanned||0}</td><td>${s.total_findings||0}</td></tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
        updateTime();
    } catch(e) { console.error(e); }
}

document.addEventListener('DOMContentLoaded', loadScanners);
setInterval(loadScanners, 30000);
</script>
{% endblock %}
